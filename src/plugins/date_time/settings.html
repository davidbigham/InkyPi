<div class="form-group">
    <label for="date-time-layout" class="form-label">Date / Time Layout:</label>

    <div id="date-time-layout-selection" class="image-grid">
        {% for layout in date_time_layouts %}
        <div
            class="image-option"
            data-layout-name="{{ layout.name }}"
            data-primary-color="{{ layout.primary_color }}"
            data-secondary-color="{{ layout.secondary_color }}"
            onclick="selectDateTimeLayout(this)"
        >
            <img
                src="{{ url_for('plugin.image', plugin_id='date_time', filename=layout.icon) }}"
                alt="{{ layout.name }}"
            />
        </div>
        {% endfor %}
    </div>
    <input type="hidden" id="selected-date-time-layout" name="selectedDateTimeLayout" value="{{ date_time_layouts[0].Name }}" />
</div>
<div class="form-group">
    <div class="form-group">
        <label for="primaryColor" class="form-label">Primary Color:</label>
        <input type="color" name="primaryColor" class="color-picker" value="{{ date_time_layouts[0].primary_color }}"/>
    </div>
    <div class="form-group">
        <label for="secondaryColor" class="form-label">Secondary Color:</label>
        <input type="color" name="secondaryColor" class="color-picker" value="{{ date_time_layouts[0].secondary_color }}"/>
    </div>
</div>

<script>
    function selectDateTimeLayout(element) {
        // Remove the selected class from any previously selected option
        const previousSelection = document.querySelector('.image-option.selected');
        if (previousSelection) {
            previousSelection.classList.remove('selected');
        }

        // Add the selected class to the clicked option
        element.classList.add('selected');

        // Update the hidden input with the selected Date / Time Layout name
        const selectedDateTimeLayout = element.dataset.layoutName;
        document.getElementById('selected-date-time-layout').value = selectedDateTimeLayout;
        document.querySelector("[name=primaryColor]").value = element.dataset.primaryColor;
        document.querySelector("[name=secondaryColor]").value = element.dataset.secondaryColor;
    }

    // Default selection for the first Date / Time Layout or based on plugin_settings
    document.addEventListener('DOMContentLoaded', () => {
        const dateTimeLayoutContainer = document.getElementById('date-time-layout-selection');
        const selectedDateTimeLayoutInput = document.getElementById('selected-date-time-layout');

        // Check if pluginSettings has a selectedDateTimeLayout value
        const selectedDateTimeLayoutFromSettings = pluginSettings?.selectedDateTimeLayout;

        let selectedOption = dateTimeLayoutContainer.querySelector('.image-option');

        if (selectedDateTimeLayoutFromSettings) {
            // Find the Date / Time Layout with the name from pluginSettings
            selectedOption = dateTimeLayoutContainer.querySelector(`.image-option[data-layout-name="${selectedDateTimeLayoutFromSettings}"]`);
        }

        // If a valid option is found, select it
        if (selectedOption) {
            selectedOption.classList.add('selected');
            selectedDateTimeLayoutInput.value = selectedOption.getAttribute('data-layout-name');
        }

        if (pluginSettings.primaryColor) {
            document.querySelector("[name=primaryColor]").value = pluginSettings.primaryColor;
        }
        if (pluginSettings.secondaryColor) {
            document.querySelector("[name=secondaryColor]").value = pluginSettings.secondaryColor;
        }
    });
</script>
